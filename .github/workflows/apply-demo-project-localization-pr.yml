name: Apply demo localization on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/demo-project-localization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/demo-project-localization
          fetch-depth: 0

      - name: Apply localization patch
        run: python .github/scripts/apply_demo_localization.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/i18n/translations.ts \
            'app/(dashboard)/projects/[projectId]/page.tsx' \
            'app/(dashboard)/projects/[projectId]/summary/page.tsx' \
            tests/unit/demo-project-localization.test.ts
          git commit -m "Localize demo project titles for SR DE EN"
          git push origin HEAD:feature/demo-project-localization
