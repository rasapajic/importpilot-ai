name: Apply profitability POST fix

on:
  push:
    branches:
      - fix/profitability-check-post

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profitability-check-post
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path

          component = Path('components/projects/simple-profitability-panel.tsx')
          text = component.read_text()
          text = text.replace('import { useRouter } from "next/navigation";\nimport { useState } from "react";\n', '')
          text = text.replace('  selectedCalculationOfferId,\n  pendingAssessmentOfferIds,\n}: {', '  selectedCalculationOfferId,\n  profitabilityError,\n}: {')
          text = text.replace('  selectedCalculationOfferId?: string;\n  pendingAssessmentOfferIds: string[];\n}) {', '  selectedCalculationOfferId?: string;\n  profitabilityError?: string;\n}) {')
          text = text.replace('  const router = useRouter();\n  const [pending, setPending] = useState(false);\n  const [error, setError] = useState("");\n\n', '')
          start = text.index('  async function checkProfitability() {')
          end = text.index('  function money(', start)
          text = text[:start] + text[end:]
          old_button = '''        <button disabled={pending || calculatedOffers.length === 0} onClick={checkProfitability} type="button">\n          {pending ? text.checking : hasFinalDecision ? text.checkAgain : text.check}\n        </button>'''
          new_button = '''        <form action={`/api/projects/${projectId}/profitability-check`} method="post">\n          <button disabled={calculatedOffers.length === 0} type="submit">\n            {hasFinalDecision ? text.checkAgain : text.check}\n          </button>\n        </form>'''
          if old_button not in text:
              raise SystemExit('button block not found')
          text = text.replace(old_button, new_button)
          text = text.replace('      {error && <p className="form-error" role="alert">{error}</p>}\n', '      {profitabilityError && (\n        <p className="form-error" role="alert">\n          {profitabilityError === "NO_CALCULATED_OFFERS"\n            ? text.enterCostsFirst\n            : locale === "de"\n              ? "Die Prüfung konnte nicht abgeschlossen werden. Bitte versuchen Sie es erneut."\n              : locale === "en"\n                ? "The profitability check could not be completed. Please try again."\n                : "Provera isplativosti nije završena. Pokušajte ponovo."}\n        </p>\n      )}\n')
          component.write_text(text)

          page = Path('app/(dashboard)/projects/[projectId]/page.tsx')
          text = page.read_text()
          text = text.replace('    importUrl?: string;\n', '    importUrl?: string;\n    profitabilityError?: string;\n')
          pending = '''  const pendingAssessmentOfferIds = project.offers\n    .filter((offer) => offer.assessments.length === 0)\n    .map((offer) => offer.id);\n'''
          text = text.replace(pending, '')
          text = text.replace('            pendingAssessmentOfferIds={pendingAssessmentOfferIds}\n', '            profitabilityError={resolvedSearchParams.profitabilityError}\n')
          page.write_text(text)
          PY

          mkdir -p modules/projects/application
          cat > modules/projects/application/profitability-check-service.ts <<'EOF'
          import { prisma } from "@/lib/database/prisma";
          import { generateProjectDecision } from "@/modules/decisions/application/project-decision-service";
          import { assessSupplierOffer } from "@/modules/intelligence/application/assessment-service";

          export class ProfitabilityProjectNotFoundError extends Error {}
          export class ProfitabilityNoCalculatedOffersError extends Error {}

          export async function checkProjectProfitability(
            projectId: string,
            organizationId: string,
          ) {
            const project = await prisma.importProject.findFirst({
              where: { id: projectId, organizationId },
              select: {
                id: true,
                offers: {
                  select: {
                    id: true,
                    costCalculations: {
                      orderBy: { createdAt: "desc" },
                      take: 1,
                      select: { id: true },
                    },
                    assessments: {
                      orderBy: { createdAt: "desc" },
                      take: 1,
                      select: { costCalculationId: true },
                    },
                  },
                },
              },
            });

            if (!project) throw new ProfitabilityProjectNotFoundError();

            const calculatedOffers = project.offers.filter(
              (offer) => offer.costCalculations.length > 0,
            );
            if (calculatedOffers.length === 0) {
              throw new ProfitabilityNoCalculatedOffersError();
            }

            for (const offer of calculatedOffers) {
              const latestCalculationId = offer.costCalculations[0].id;
              const latestAssessmentCalculationId = offer.assessments[0]?.costCalculationId ?? null;
              if (latestAssessmentCalculationId !== latestCalculationId) {
                await assessSupplierOffer(offer.id, organizationId);
              }
            }

            return generateProjectDecision(projectId, organizationId);
          }
          EOF
          sed -i 's/^          //' modules/projects/application/profitability-check-service.ts

          mkdir -p 'app/api/projects/[projectId]/profitability-check'
          cat > 'app/api/projects/[projectId]/profitability-check/route.ts' <<'EOF'
          import { NextRequest, NextResponse } from "next/server";

          import { authenticateRequest } from "@/modules/auth/infrastructure/request-auth";
          import {
            checkProjectProfitability,
            ProfitabilityNoCalculatedOffersError,
            ProfitabilityProjectNotFoundError,
          } from "@/modules/projects/application/profitability-check-service";

          function acceptsHtml(request: NextRequest) {
            return request.headers.get("accept")?.includes("text/html") ?? false;
          }

          function projectRedirect(request: NextRequest, projectId: string, error?: string) {
            const url = new URL(`/projects/${projectId}`, request.url);
            if (error) url.searchParams.set("profitabilityError", error);
            url.hash = "workflow-step-decision";
            return NextResponse.redirect(url, 303);
          }

          export async function POST(
            request: NextRequest,
            { params }: { params: Promise<{ projectId: string }> },
          ) {
            const { projectId } = await params;
            const auth = await authenticateRequest(request);
            if (!auth) {
              if (acceptsHtml(request)) {
                const login = new URL("/login", request.url);
                login.searchParams.set("next", `/projects/${projectId}`);
                return NextResponse.redirect(login, 303);
              }
              return NextResponse.json({ error: "UNAUTHENTICATED" }, { status: 401 });
            }

            try {
              const decision = await checkProjectProfitability(
                projectId,
                auth.membership.organizationId,
              );
              return acceptsHtml(request)
                ? projectRedirect(request, projectId)
                : NextResponse.json(decision, { status: 201 });
            } catch (error) {
              const code = error instanceof ProfitabilityNoCalculatedOffersError
                ? "NO_CALCULATED_OFFERS"
                : error instanceof ProfitabilityProjectNotFoundError
                  ? "PROJECT_NOT_FOUND"
                  : "CHECK_FAILED";
              const status = code === "PROJECT_NOT_FOUND" ? 404 : code === "CHECK_FAILED" ? 500 : 400;
              return acceptsHtml(request)
                ? projectRedirect(request, projectId, code)
                : NextResponse.json({ error: code }, { status });
            }
          }
          EOF
          sed -i 's/^          //' 'app/api/projects/[projectId]/profitability-check/route.ts'

          cat > tests/unit/profitability-check-form.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";

          import { describe, expect, it } from "vitest";

          const panelSource = readFileSync(
            join(process.cwd(), "components/projects/simple-profitability-panel.tsx"),
            "utf8",
          );
          const routeSource = readFileSync(
            join(process.cwd(), "app/api/projects/[projectId]/profitability-check/route.ts"),
            "utf8",
          );
          const serviceSource = readFileSync(
            join(process.cwd(), "modules/projects/application/profitability-check-service.ts"),
            "utf8",
          );

          describe("profitability check fallback", () => {
            it("uses a native POST form instead of a client-only click handler", () => {
              expect(panelSource).toContain('action={`/api/projects/${projectId}/profitability-check`}');
              expect(panelSource).toContain('method="post"');
              expect(panelSource).not.toContain("onClick={checkProfitability}");
            });

            it("redirects browser form submissions back to the decision step", () => {
              expect(routeSource).toContain("NextResponse.redirect(url, 303)");
              expect(routeSource).toContain('url.hash = "workflow-step-decision"');
            });

            it("reassesses an offer when its latest calculation is newer than its assessment", () => {
              expect(serviceSource).toContain("latestAssessmentCalculationId !== latestCalculationId");
              expect(serviceSource).toContain("await assessSupplierOffer(offer.id, organizationId)");
              expect(serviceSource).toContain("return generateProjectDecision(projectId, organizationId)");
            });
          });
          EOF
          sed -i 's/^          //' tests/unit/profitability-check-form.test.ts

          git rm .github/workflows/apply-profitability-post-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/projects/simple-profitability-panel.tsx 'app/(dashboard)/projects/[projectId]/page.tsx' modules/projects/application/profitability-check-service.ts 'app/api/projects/[projectId]/profitability-check/route.ts' tests/unit/profitability-check-form.test.ts
          git commit -m "Make profitability check a reliable server POST"
          git push origin HEAD:fix/profitability-check-post
