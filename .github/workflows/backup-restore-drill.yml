name: ImportPilot PostgreSQL backup restore drill

on:
  push:
    branches:
      - verify/importpilot-backup-restore-drill

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradepilot
          POSTGRES_PASSWORD: tradepilot
          POSTGRES_DB: tradepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tradepilot -d tradepilot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://tradepilot:tradepilot@localhost:5432/tradepilot?schema=public
      TEST_DATABASE_URL: postgresql://tradepilot:tradepilot@localhost:5432/tradepilot?schema=public
      PGPASSWORD: tradepilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and migrate source database
        run: npm run db:generate && npm run db:migrate:deploy

      - name: Seed representative release data
        run: node scripts/backup-restore-fixture.mjs | tee /tmp/fixture.json

      - name: Create custom-format backup and checksum
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --version
          pg_restore --version
          pg_dump \
            "postgresql://tradepilot:tradepilot@localhost:5432/tradepilot" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file=/tmp/importpilot-predeploy.dump
          test -s /tmp/importpilot-predeploy.dump
          sha256sum /tmp/importpilot-predeploy.dump | tee /tmp/importpilot-predeploy.sha256
          test -s /tmp/importpilot-predeploy.sha256
          echo "BACKUP_CREATED bytes=$(stat -c%s /tmp/importpilot-predeploy.dump)"

      - name: Restore into an empty database
        shell: bash
        run: |
          set -euo pipefail
          dropdb --if-exists -h localhost -U tradepilot importpilot_restore_test
          createdb -h localhost -U tradepilot importpilot_restore_test
          pg_restore \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            --dbname="postgresql://tradepilot:tradepilot@localhost:5432/importpilot_restore_test" \
            /tmp/importpilot-predeploy.dump
          echo "RESTORE_COMPLETED"

      - name: Verify restored schema and representative data
        env:
          DATABASE_URL: postgresql://tradepilot:tradepilot@localhost:5432/importpilot_restore_test?schema=public
        run: node scripts/backup-restore-verify.mjs

      - name: Clean up restore database
        if: always()
        shell: bash
        run: |
          dropdb --if-exists -h localhost -U tradepilot importpilot_restore_test || true
