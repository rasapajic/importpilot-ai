name: ImportPilot browser staging smoke

on:
  push:
    branches:
      - verify/importpilot-browser-smoke

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_ORIGIN: https://importpilot-1-0-staging.onrender.com
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Verify staging health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$STAGING_ORIGIN/api/health" -o /tmp/health.json
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json
          grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json

      - name: Run Chromium locale and viewport smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pw && mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            npm install --silent playwright@1.55.0
            npx playwright install chromium >/dev/null
            CHROME=$(NODE_PATH=/tmp/pw/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')
          fi
          cd "$GITHUB_WORKSPACE"
          echo "chrome=$CHROME"
          NODE_PATH=/tmp/pw/node_modules CHROME="$CHROME" STAGING_ORIGIN="$STAGING_ORIGIN" node scripts/staging-browser-smoke.cjs
          echo "CHROMIUM_LOCALE_VIEWPORT PASS"
