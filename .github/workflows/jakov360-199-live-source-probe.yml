name: JAKOV360 #199 isolated public-source probe

on:
  pull_request:
    paths:
      - 'scripts/url-import-199-live-probe.ts'
      - 'services/importpilot-url-import-provider/src/marketplace-price-source-parser.ts'
      - 'services/importpilot-url-import-provider/src/marketplace-price-source-reader.ts'
      - 'services/importpilot-url-import-provider/src/contract.ts'
      - 'services/importpilot-url-import-provider/src/fetcher.ts'
      - 'services/importpilot-url-import-provider/src/app.ts'
      - 'services/importpilot-url-import-provider/src/dev.ts'
      - 'services/importpilot-url-import-provider/tests/marketplace-price-preview-bridge-199.test.ts'
      - 'services/importpilot-url-import-provider/tests/marketplace-price-source-reader-199.test.ts'
      - '.github/workflows/jakov360-199-live-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_source_probe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/url-import-199-bounded-video-catalog-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      URL_IMPORT_PROVIDER_URL: ""
      URL_IMPORT_PROVIDER_TOKEN: ""
      SUPPLIER_SEARCH_PROVIDER_URL: ""
      SUPPLIER_SEARCH_PROVIDER_TOKEN: ""
    steps:
      - name: Checkout unprivileged candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install tooling without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Probe exact public product, video, seller catalog (read-only; no raw HTML logs)
        run: npx tsx scripts/url-import-199-live-probe.ts

  provider_security:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/url-import-199-bounded-video-catalog-reader' || github.head_ref == 'feat/url-import-199-opt-in-provenance-bridge-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate ephemeral provider lockfile
        working-directory: services/importpilot-url-import-provider
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install isolated provider dependencies
        working-directory: services/importpilot-url-import-provider
        run: npm ci --ignore-scripts --no-audit
      - name: Audit runtime dependencies
        working-directory: services/importpilot-url-import-provider
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck isolated provider
        working-directory: services/importpilot-url-import-provider
        run: npm run typecheck
      - name: Create ephemeral provider-only Vitest config
        working-directory: services/importpilot-url-import-provider
        run: |
          cat > vitest.security.config.mts <<'EOF'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({
            test: { include: ['tests/**/*.test.ts'], environment: 'node' },
          });
          EOF
      - name: Run exact-SKU, redirect, catalog and video parser tests
        working-directory: services/importpilot-url-import-provider
        run: npx vitest run --config vitest.security.config.mts
      - name: Build isolated provider
        working-directory: services/importpilot-url-import-provider
        run: npm run build
