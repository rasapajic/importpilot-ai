name: Patch existing index names

on:
  push:
    branches:
      - fix/importpilot-ai-usage-prisma-drift

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/importpilot-ai-usage-prisma-drift

      - name: Map Prisma indexes to existing PostgreSQL names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("prisma/schema.prisma")
          schema = path.read_text()

          def patch_model(model_name, replacements):
              global schema
              start_marker = f"model {model_name} {{"
              start = schema.index(start_marker)
              next_model = schema.find("\nmodel ", start + len(start_marker))
              end = len(schema) if next_model == -1 else next_model
              block = schema[start:end]
              for old, new in replacements:
                  count = block.count(old)
                  if count != 1:
                      raise SystemExit(f"{model_name}: expected exactly one {old!r}, found {count}")
                  block = block.replace(old, new, 1)
              schema = schema[:start] + block + schema[end:]

          patch_model("SupplierSearchCache", [
              ("  @@unique([normalizedQuery, targetCountry, quantity])",
               "  @@unique([normalizedQuery, targetCountry, quantity], map: \"supplier_search_cache_lookup_key\")"),
              ("  @@index([normalizedQuery, targetCountry, quantity, createdAt])",
               "  @@index([normalizedQuery, targetCountry, quantity, createdAt], map: \"supplier_search_cache_lookup_created_at_idx\")"),
          ])
          patch_model("ImportProject", [
              ("  @@index([organizationId, completionStatus, createdAt])",
               "  @@index([organizationId, completionStatus, createdAt], map: \"import_projects_organization_id_completion_status_created_at_id\")"),
          ])
          patch_model("RecommendationFeedback", [
              ("  @@index([organizationId, projectId, createdAt])",
               "  @@index([organizationId, projectId, createdAt], map: \"recommendation_feedback_organization_id_project_id_created_at_i\")"),
          ])
          patch_model("ProjectCompletionHistory", [
              ("  @@index([organizationId, projectId, createdAt])",
               "  @@index([organizationId, projectId, createdAt], map: \"project_completion_history_organization_id_project_id_created_a\")"),
          ])
          patch_model("ProjectActivity", [
              ("  @@index([organizationId, projectId, type, createdAt])",
               "  @@index([organizationId, projectId, type, createdAt], map: \"project_activities_organization_id_project_id_type_created_at_i\")"),
          ])

          path.write_text(schema)
          PY

          git diff --check

      - name: Commit schema index mappings
        shell: bash
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "No schema change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "Map Prisma indexes to existing database names"
          git push origin HEAD:fix/importpilot-ai-usage-prisma-drift
