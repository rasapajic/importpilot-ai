name: Patch simplified multi-offer selection

on:
  push:
    branches:
      - fix/importpilot-simple-multi-offer-selection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importpilot-simple-multi-offer-selection

      - name: Apply patch
        run: python scripts/patch-simple-multi-offer.py

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/search/simple-supplier-offer-search.tsx tests/unit/simple-supplier-offer-search.test.tsx
          git commit -m "Keep simplified supplier results open for multi-offer selection"
          git push origin HEAD:fix/importpilot-simple-multi-offer-selection
