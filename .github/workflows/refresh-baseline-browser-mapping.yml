name: Refresh baseline-browser-mapping lockfile

on:
  push:
    branches:
      - fix/importpilot-baseline-browser-mapping-advisory

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/importpilot-baseline-browser-mapping-advisory

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh only baseline-browser-mapping in lockfile
        shell: bash
        run: |
          npm update baseline-browser-mapping --package-lock-only --ignore-scripts
          node -e "const l=require('./package-lock.json'); const p=l.packages?.['node_modules/baseline-browser-mapping']; console.log('baseline-browser-mapping', p?.version); if (!p?.version) process.exit(2); const [a,b]=p.version.split('.').map(Number); if (a < 2 || (a === 2 && b < 11)) process.exit(3)"
          npm audit --omit=dev --audit-level=moderate
          git diff --check

      - name: Commit lockfile-only refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change to commit."
            exit 0
          fi
          if ! git diff --quiet -- package.json; then
            echo "package.json changed unexpectedly" >&2
            git diff -- package.json
            exit 4
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh baseline-browser-mapping security patch"
          git push origin HEAD:fix/importpilot-baseline-browser-mapping-advisory
