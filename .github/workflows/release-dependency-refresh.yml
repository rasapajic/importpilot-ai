name: Release dependency refresh

on:
  push:
    branches:
      - release/importpilot-1.0-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[deps-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/importpilot-1.0-hardening
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh patched production dependencies
        run: |
          npm install --save-exact next@16.3.5
          npm pkg set overrides.postcss=8.5.23
          npm install --package-lock-only

      - name: Show production audit after refresh
        run: npm audit --omit=dev || true

      - name: Commit dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh production dependencies [deps-refresh]"
          git push origin HEAD:release/importpilot-1.0-hardening
