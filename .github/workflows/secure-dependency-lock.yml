name: Secure Dependency Lock Update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/importpilot-1-0-core-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate secure dependency lock
        run: |
          npm pkg set dependencies.next=16.3.5
          npm pkg set devDependencies.eslint-config-next=16.3.5
          npm pkg delete overrides.postcss
          npm pkg set overrides.deepmerge-ts=8.0.2
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade framework dependencies for security"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
