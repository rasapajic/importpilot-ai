name: ImportPilot staging public smoke

on:
  push:
    branches:
      - verify/importpilot-staging-public-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_ORIGIN: https://importpilot-1-0-staging.onrender.com
    steps:
      - name: Wait for healthy Google-enabled staging candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/health.json /tmp/login.html
          for attempt in $(seq 1 30); do
            echo "staging_probe_attempt=$attempt"
            health_ok=false
            login_ok=false

            if curl --fail --silent --show-error --max-time 20 \
              "$STAGING_ORIGIN/api/health" -o /tmp/health.json; then
              if grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json \
                && grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
                health_ok=true
              fi
            fi

            if curl --fail --silent --show-error --max-time 20 \
              "$STAGING_ORIGIN/login" -o /tmp/login.html; then
              if grep -Fq 'Continue with Google' /tmp/login.html; then
                login_ok=true
              fi
            fi

            echo "health_ok=$health_ok google_ui_ok=$login_ok"
            if [ "$health_ok" = true ] && [ "$login_ok" = true ]; then
              echo "STAGING_DEPLOYMENT_MARKER PASS"
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done

          echo "STAGING_DEPLOYMENT_MARKER BLOCKED" >&2
          echo "Last health body:" >&2
          cat /tmp/health.json >&2 || true
          exit 1

      - name: Verify Google start route is live and controlled
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 \
            --output /dev/null \
            --dump-header /tmp/google.headers \
            "$STAGING_ORIGIN/api/auth/google/start?from=login"

          status=$(awk 'NR==1 {print $2}' /tmp/google.headers)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /, ""); sub(/\r$/, ""); print; exit}' /tmp/google.headers)
          echo "google_start_status=$status"
          echo "google_start_location_host=$(node -e 'try { console.log(new URL(process.argv[1]).host) } catch { console.log("invalid") }' "$location")"

          case "$status" in
            301|302|303|307|308) ;;
            *) echo "Google start route did not return a redirect." >&2; cat /tmp/google.headers >&2; exit 2 ;;
          esac

          if [ -z "$location" ]; then
            echo "Google start route did not provide a Location header." >&2
            exit 3
          fi

          if [[ "$location" != https://accounts.google.com/* \
            && "$location" != "$STAGING_ORIGIN/login?googleError=not-configured" ]]; then
            echo "Unexpected Google start redirect: $location" >&2
            exit 4
          fi

          echo "GOOGLE_START_ROUTE PASS"
