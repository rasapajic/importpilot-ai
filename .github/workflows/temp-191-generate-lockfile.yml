name: Temporary #191 lockfile-only generation

on:
  push:
    branches:
      - security/jakov360-191-root-next-zod-floor
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate_root_lockfile:
    if: github.repository == 'rasapajic/importpilot-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: security/jakov360-191-root-next-zod-floor
          fetch-depth: 1
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve lockfile only without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify root manifest and lockfile resolve exact approved versions
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = { next: '16.4.3', zod: '4.6.7', 'eslint-config-next': '16.4.3' };
          for (const [name, expected] of Object.entries(version)) {
            const declared = manifest.dependencies?.[name] ?? manifest.devDependencies?.[name];
            const locked = lock.packages?.['node_modules/' + name]?.version;
            const rootDeclared = lock.packages?.['']?.dependencies?.[name] ??
              lock.packages?.['']?.devDependencies?.[name];
            if (declared !== expected || locked !== expected || rootDeclared !== expected) {
              throw Error(name + ' manifest/lock mismatch');
            }
          }
          console.log('APPROVED_DEPENDENCY_LOCKFILE_VERIFIED');
          JS
          git diff --exit-code -- package.json
      - name: Commit only generated root package-lock on this isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes generated'
            exit 0
          fi
          git commit -m 'lockfile: resolve Next.js 16.4.3 and Zod 4.6.7 for issue 191'
          git push origin HEAD:refs/heads/security/jakov360-191-root-next-zod-floor
