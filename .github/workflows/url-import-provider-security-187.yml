name: URL import provider security gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/importpilot-url-import-provider/**"
      - ".github/workflows/url-import-provider-security-187.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider_typecheck_tests_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/importpilot-url-import-provider
    steps:
      - name: Checkout PR code without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate ephemeral provider lockfile (not committed)
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install isolated URL provider dependencies
        run: npm ci
      - name: Typecheck URL provider
        run: npm run typecheck
      - name: Create ephemeral provider-only Vitest config
        run: |
          cat > vitest.security.config.mts <<'EOF'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({
            test: { include: ['tests/**/*.test.ts'], environment: 'node', clearMocks: false },
          });
          EOF
      - name: Test redirect, exact SKU, and existing preview API
        run: npx vitest run --config vitest.security.config.mts
      - name: Build URL provider
        run: npm run build

  provider_dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/importpilot-url-import-provider
    steps:
      - name: Checkout PR code without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate ephemeral provider lockfile (not committed)
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install isolated URL provider dependencies
        run: npm ci
      - name: Audit production dependencies for high or critical issues
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complete development and production tree for moderate-or-higher issues
        run: npm audit --audit-level=moderate

  provider_node22_docker_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated release candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact Render URL-import provider Dockerfile on Node 22
        run: docker build --pull --tag jakov360-url-import-rehearsal:local services/importpilot-url-import-provider
      - name: Start isolated ephemeral Docker container (no supplier requests)
        run: |
          docker run -d --name jakov360-url-import-rehearsal \
            -p 127.0.0.1:4100:4100 \
            -e URL_IMPORT_PROVIDER_TOKEN=ci-test-only-token \
            jakov360-url-import-rehearsal:local
      - name: Smoke health, revision endpoint, and protected invalid-request response
        run: |
          set -euo pipefail
          node - <<'JS'
          const base = 'http://127.0.0.1:4100';
          const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function healthy() {
            for (let attempt=0; attempt < 45; attempt++) {
              try {
                const r = await fetch(base + '/health');
                if (r.ok && (await r.json()).ok === true) return;
              } catch {}
              await pause(1000);
            }
            throw Error('Container did not become healthy');
          }
          (async () => {
            await healthy();
            const version = await fetch(base + '/version');
            if (!version.ok || (await version.json()).service !== 'importpilot-url-import-provider') throw Error('Invalid version endpoint');
            const unauthorized = await fetch(base + '/preview', {
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({productUrl:'https://www.alibaba.com/product-detail/test_12345.html'})
            });
            if (unauthorized.status !== 401) throw Error('Preview auth regression');
            const invalid = await fetch(base + '/preview', {
              method:'POST',
              headers:{'content-type':'application/json','authorization':'Bearer ci-test-only-token'},
              body:JSON.stringify({productUrl:'http://127.0.0.1/private'})
            });
            if (invalid.status !== 400 || (await invalid.json()).reason !== 'INVALID_URL') throw Error('Invalid URL guard regression');
            console.log('RENDER_DOCKER_NODE22_HEALTH_AUTH_URL_GATES_PASS');
          })().catch(e => { console.error(e.message); process.exitCode=1; });
          JS
      - name: Clean up ephemeral container
        if: always()
        run: |
          docker logs jakov360-url-import-rehearsal --tail 40 || true
          docker rm -f jakov360-url-import-rehearsal || true

