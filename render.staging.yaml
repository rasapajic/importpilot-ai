services:
  - type: web
    name: importpilot-1-0-staging
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run db:migrate:deploy && NODE_ENV=production npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ORIGIN
        value: https://importpilot-1-0-staging.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: importpilot-staging-db
          property: connectionString
      - key: SUPPLIER_SEARCH_PROVIDER_BASE_URL
        fromService:
          type: web
          name: importpilot-search-provider
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPPLIER_SEARCH_PROVIDER_TOKEN
        fromService:
          type: web
          name: importpilot-search-provider
          envVarKey: SEARCH_PROVIDER_TOKEN
      - key: SUPPLIER_SEARCH_PROVIDER_TIMEOUT_MS
        value: "55000"
      - key: SUPPLIER_SEARCH_PROVIDER_MAX_ATTEMPTS
        value: "1"
      - key: URL_IMPORT_PROVIDER_URL
        value: https://importpilot-url-import-provider.onrender.com/preview
      - key: URL_IMPORT_PROVIDER_TOKEN
        fromService:
          type: web
          name: importpilot-url-import-provider
          envVarKey: URL_IMPORT_PROVIDER_TOKEN
      - key: S3_ENDPOINT
        value: https://storage-disabled.invalid
      - key: S3_PUBLIC_ENDPOINT
        value: https://storage-disabled.invalid
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: importpilot-staging-disabled
      - key: S3_ACCESS_KEY
        value: disabled
      - key: S3_SECRET_KEY
        generateValue: true

databases:
  - name: importpilot-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
